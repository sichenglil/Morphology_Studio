name: E2E
on: [push, pull_request]
permissions: {contents: read}
jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/frontend/pnpm-lock.yaml}
      - run: python -m pip install -e '.[web]'
      - run: pnpm --dir web/frontend install --frozen-lockfile
      - run: pnpm --dir web/frontend exec playwright install --with-deps chromium
      - run: pnpm --dir web/frontend build
      - run: pnpm --dir web/frontend exec playwright test
        env: {PYTHONPATH: '${{ github.workspace }}/src', MORPHOLOGY_E2E_MODEL: '${{ github.workspace }}/examples/simple_two_link/robot.urdf'}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: playwright-report, path: web/frontend/playwright-report, if-no-files-found: ignore}
