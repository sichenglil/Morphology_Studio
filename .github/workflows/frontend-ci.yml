name: Frontend CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/frontend/pnpm-lock.yaml}
      - run: pnpm --dir web/frontend install --frozen-lockfile
      - run: pnpm --dir web/frontend type-check
      - run: pnpm --dir web/frontend lint
      - run: pnpm --dir web/frontend test
      - run: pnpm --dir web/frontend build
