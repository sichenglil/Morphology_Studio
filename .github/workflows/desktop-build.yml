name: Desktop Build
on: [workflow_dispatch, pull_request]
permissions: {contents: read}
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python -m pip install -e '.[dev,desktop]'
      - run: python -m pip install pyinstaller
      - run: pnpm --dir web/frontend install --frozen-lockfile
      - run: powershell -ExecutionPolicy Bypass -File scripts/build/build_desktop.ps1
      - uses: actions/upload-artifact@v4
        with: {name: MorphologyStudio-windows, path: 'dist/MorphologyStudio/**', if-no-files-found: error}
