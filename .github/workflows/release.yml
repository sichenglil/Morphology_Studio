name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions: {contents: write}
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: pnpm/action-setup@v4
        with: {version: 11.9.0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: python -m pip install -e '.[dev,desktop,docs]'
      - run: python -m pip install pyinstaller
      - run: pnpm --dir web/frontend install --frozen-lockfile
      - run: powershell -ExecutionPolicy Bypass -File scripts/test_all.ps1
      - run: powershell -ExecutionPolicy Bypass -File scripts/build_desktop.ps1
      - run: Compress-Archive -Path dist/MorphologyStudio -DestinationPath dist/MorphologyStudio-windows.zip
      - run: (Get-FileHash dist/MorphologyStudio-windows.zip -Algorithm SHA256).Hash + '  MorphologyStudio-windows.zip' | Set-Content dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with: {generate_release_notes: true, files: 'dist/MorphologyStudio-windows.zip,dist/SHA256SUMS.txt'}
