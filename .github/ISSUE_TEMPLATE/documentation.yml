name: Documentation issue
description: Report missing, inaccurate, or unclear documentation
body:
  - type: input
    id: page
    attributes: {label: Page or section}
    validations: {required: true}
  - type: textarea
    id: issue
    attributes: {label: What is unclear or incorrect?}
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested improvement}
