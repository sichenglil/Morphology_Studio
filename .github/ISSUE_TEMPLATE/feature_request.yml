name: Feature request
description: Propose a general-purpose capability
body:
  - type: textarea
    id: problem
    attributes: {label: Problem and user workflow}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behavior and alternatives}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes: {label: Safety, options: [{label: "This request contains no confidential models, tokens, or private paths.", required: true}]}
