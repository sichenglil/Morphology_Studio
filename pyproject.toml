[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morphology-toolkit"
version = "0.1.0"
description = "Desktop toolkit for importing, visualizing, editing, assembling, validating, and converting generic robot models"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9,<3.14"
authors = [{name = "Morphology Studio maintainers"}]
keywords = ["robotics", "urdf", "xacro", "threejs", "robot-model"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "pytest-cov>=4,<7", "ruff>=0.5,<1", "httpx>=0.27", "httpx2>=0.3", "xacro>=2,<3", "Pillow>=11,<12"]
docs = ["mkdocs>=1.6,<2"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
desktop = ["fastapi>=0.110", "uvicorn>=0.27", "pywebview>=5.4"]
mesh = ["trimesh>=4"]

[project.scripts]
morphology-tool = "morphology_toolkit.cli:main"
morphology-tool-desktop = "morphology_toolkit.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
morphology_toolkit = ["static/*.html", "static/frontend/*.html", "static/frontend/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["morphology_toolkit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E9", "F", "I", "B"]
ignore = ["BLE001"]
