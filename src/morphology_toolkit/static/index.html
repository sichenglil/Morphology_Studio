<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Morphology Toolkit</title><style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#121b26;--line:#26384b;--ink:#e9f0f7;--muted:#8fa4b8;--cyan:#3dd6c6;--blue:#58a6ff;--bad:#ff6b7a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17314a 0,transparent 35%),var(--bg);color:var(--ink);font:14px Inter,Segoe UI,sans-serif}header{padding:28px 5vw 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}h1{margin:0;font-size:28px;letter-spacing:.02em}header p{margin:7px 0 0;color:var(--muted)}.status{font-family:Consolas;color:var(--cyan)}main{padding:24px 5vw 60px;display:grid;grid-template-columns:minmax(420px,1.2fr) minmax(320px,.8fr);gap:20px}.panel{background:linear-gradient(160deg,#152130,#0f1721);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 18px 45px #0005}h2{font-size:16px;margin:0 0 14px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}.tabs button{background:#182636}.tabs button.on{border-color:var(--cyan);color:var(--cyan)}button,input,textarea{border:1px solid var(--line);border-radius:8px;background:#0c141e;color:var(--ink);padding:10px}button{cursor:pointer;background:#17314a}button:hover{border-color:var(--blue)}button.primary{background:linear-gradient(90deg,#116a71,#16568a);font-weight:700}.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.field{margin:11px 0}.field label{display:block;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%}textarea{min-height:88px;font-family:Consolas}.view{display:none}.view.on{display:block}pre{background:#080d13;border:1px solid #1d2c3a;padding:14px;min-height:430px;max-height:70vh;overflow:auto;border-radius:9px;white-space:pre-wrap;color:#b9d5ee}.hint{color:var(--muted);font-size:12px}.ok{color:var(--cyan)}.fail{color:var(--bad)}@media(max-width:900px){main{grid-template-columns:1fr}}
</style></head><body><header><div><h1>Morphology Toolkit</h1><p>通用机器人模型 · 本地只读源文件 · 生成物写入 build/workspace</p></div><div class="status" id="status">连接中…</div></header><main><section class="panel"><div class="tabs" id="tabs"><button data-tab="scan" class="on">扫描</button><button data-tab="xacro">Xacro</button><button data-tab="assemble">装配</button><button data-tab="validate">验证</button><button data-tab="export">导出</button></div>
<div id="scan" class="view on"><h2>模型扫描与结构</h2><div class="row"><input id="scanPath" placeholder="选择模型文件或目录"><button onclick="pick('scanPath','directory')">选择目录</button></div><button class="primary" onclick="analyze()">分析候选</button></div>
<div id="xacro" class="view"><h2>无 ROS Xacro 生成</h2><div class="row"><input id="xInput" placeholder="Xacro 文件"><button onclick="pick('xInput','file')">选择</button></div><div class="row"><input id="xMap" value="config/models/package_maps/local_models.yaml"><button onclick="pick('xMap','file')">Package map</button></div><div class="field"><label>参数，每行 NAME=VALUE</label><textarea id="xArgs">ur_type=ur5e
name=robot
tf_prefix=</textarea></div><div class="field"><label>输出 URDF</label><input id="xOutput" value="build/generated/robot.urdf"></div><button class="primary" onclick="run('build_xacro',{input:v('xInput'),output:v('xOutput'),package_map:v('xMap'),arguments:v('xArgs')})">生成 URDF</button></div>
<div id="assemble" class="view"><h2>配置式通用装配</h2><div class="row"><input id="aConfig" placeholder="选择装配 YAML 配置"><button onclick="pick('aConfig','file')">选择</button></div><div class="field"><label>输出 URDF</label><input id="aOutput" value="generated/combined.urdf"></div><button class="primary" onclick="run('assemble',{config:v('aConfig'),output:v('aOutput')})">执行装配</button></div>
<div id="validate" class="view"><h2>模型验证</h2><div class="row"><input id="vInput" value="assets/robot_models/ur5e_hx5_right/robot.urdf"><button onclick="pick('vInput','file')">选择</button></div><div class="field"><label>Package map</label><input id="vMap" value="config/models/package_maps/local_models.yaml"></div><div class="field"><label>报告目录</label><input id="vOutput" value="artifacts/reports/ui_validation"></div><button class="primary" onclick="run('validate',{input:v('vInput'),output:v('vOutput'),package_map:v('vMap')})">运行验证</button></div>
<div id="export" class="view"><h2>可移植包 / MJCF / Morphology</h2><div class="row"><input id="eInput" value="assets/robot_models/ur5e_hx5_right/robot.urdf"><button onclick="pick('eInput','file')">选择 URDF</button></div><div class="field"><label>Package map</label><input id="eMap" value="config/models/package_maps/local_models.yaml"></div><div class="field"><label>输出</label><input id="eOutput" value="artifacts/temporary/export"></div><button onclick="run('package',{input:v('eInput'),output:v('eOutput'),package_map:v('eMap')})">可移植包</button> <button onclick="run('mjcf',{input:v('eInput'),output:v('eOutput')+'.xml'})">MJCF</button> <button onclick="run('morphology',{input:v('eInput'),output:v('eOutput')+'.json'})">Morphology</button></div>
</section><aside class="panel"><h2>执行结果</h2><div class="hint">所有操作在本机执行；失败会显示真实退出码。</div><pre id="out">等待操作…</pre></aside></main><script>
const out=document.querySelector('#out');const v=id=>document.querySelector('#'+id).value;document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelector('#'+b.dataset.tab).classList.add('on')});
async function pick(id,kind){let r=await fetch('/api/pick?kind='+kind);let d=await r.json();if(d.path)document.querySelector('#'+id).value=d.path}
async function analyze(){out.textContent='分析中…';let r=await fetch('/api/analyze?path='+encodeURIComponent(v('scanPath')));out.textContent=JSON.stringify(await r.json(),null,2)}
async function run(action,values){out.textContent='执行中…';let r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,values})});let d=await r.json();out.textContent=JSON.stringify(d,null,2);out.className=d.ok?'ok':'fail'}
fetch('/api/status').then(r=>r.json()).then(d=>document.querySelector('#status').textContent='Xacro '+(d.xacro.includes('NOT_')?'不可用':'就绪')+' · ROS/Isaac NOT_AVAILABLE_LOCAL');
</script></body></html>
